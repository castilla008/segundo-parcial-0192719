
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Café Aroma</title>

    <link rel="stylesheet"
          href="../styles/styles.css">
</head>

<body>

    <!-- MENÚ SUPERIOR -->
    <header class="cabecera" id="inicio">

        <a href="#inicio" class="marca">
            <span class="marca-icono">☕</span>
            <span>Café <em>Aroma</em></span>
        </a>

        <nav class="navegacion">
            <a href="#inicio" class="activo">Inicio</a>
            <a href="#nosotros">Nosotros</a>
            <a href="#productos">Productos</a>
            <a href="mailto:hola@ejemplo.com">Contacto</a>
        </nav>

        <a href="#productos" class="boton-menu">
            Explorar menú →
        </a>

    </header>

    <main>

        <!-- PORTADA -->
        <section class="portada">

            <div class="portada-texto">

                <h1>
                    Enjoy your coffee
                    <br>
                    with your own
                    <br>
                    <em>unique cafe</em>
                </h1>

                <a href="#productos"
                   class="boton-principal">
                    EXPLORE PRODUCT →
                </a>

            </div>

            <div class="portada-imagen">
                <img
                    src="../assets/cafe-principal.png"
                    alt="Taza de café espresso"
                >
            </div>

        </section>

        <!-- ESTADÍSTICAS -->
        <section class="estadisticas" id="nosotros">

            <div class="estadistica">
                <strong>60+</strong>
                <span>Coffee Variant</span>
            </div>

            <div class="estadistica">
                <strong>10+</strong>
                <span>Meeting room</span>
            </div>

            <div class="estadistica">
                <strong>15+</strong>
                <span>Event space</span>
            </div>

            <div class="estadistica">
                <strong>20+</strong>
                <span>Global Achievement</span>
            </div>

        </section>

        <!-- GALERÍA DE CAFÉS -->
        <section class="productos" id="productos">

            <div class="galeria">

                <figure class="tarjeta">
                    <img src="../assets/cafe1.png"
                         alt="Café cremoso">
                </figure>

                <figure class="tarjeta">
                    <img src="../assets/cafe2.png"
                         alt="Café con leche">
                </figure>

                <figure class="tarjeta">
                    <img src="../assets/cafe3.png"
                         alt="Café negro con hielo">
                </figure>

                <figure class="tarjeta">
                    <img src="../assets/cafe4.png"
                         alt="Capuchino">
                </figure>

                <figure class="tarjeta">
                    <img src="../assets/cafe5.png"
                         alt="Café clásico">
                </figure>

            </div>

        </section>

    </main>

</body>
</html>
