
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Café Aroma</title>

    <style>
        /* CONFIGURACIÓN GENERAL */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: white;
            font-family: Georgia, serif;
        }

        html {
            scroll-behavior: smooth;
        }

        /* ENCABEZADO */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 7%;
        }

        header h1 {
            color: #ce955f;
            font-size: 32px;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* PORTADA */

        .portada {
            text-align: center;
            padding: 70px 20px;
        }

        .portada h2 {
            font-size: clamp(38px, 5vw, 75px);
            font-weight: normal;
            line-height: 1.15;
        }

        .portada span {
            color: #ce955f;
            font-style: italic;
        }

        .boton {
            display: inline-block;
            margin-top: 35px;
            padding: 20px 40px;
            background-color: #75452a;
            color: white;
            border-radius: 35px;
            text-decoration: none;
        }

        /* ESTADÍSTICAS */

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
            gap: 15px;
            padding: 40px 7%;
        }

        .estadisticas div {
            border-right: 1px solid #ce955f;
        }

        .estadisticas div:last-child {
            border-right: none;
        }

        .estadisticas h3 {
            font-size: 55px;
            font-weight: normal;
        }

        .estadisticas p {
            font-size: 20px;
        }
